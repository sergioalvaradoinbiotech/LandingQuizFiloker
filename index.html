<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filoker | Protocolo Clínico</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #050505; --text: #ffffff; --accent: #1a4f36; --accent-glow: #2ce683; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); overflow-x: hidden; }
        
        .header { position: fixed; top: 0; width: 100%; padding: 30px 50px; z-index: 100; mix-blend-mode: difference; }
        .logo { font-weight: 900; font-size: 1.5rem; letter-spacing: 4px; }
        
        .hero { height: 100vh; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
        
        /* Efecto de luz de fondo */
        .glow-sphere {
            position: absolute; width: 60vw; height: 60vw; background: radial-gradient(circle, rgba(44,230,131,0.1) 0%, rgba(0,0,0,0) 70%);
            top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 0; pointer-events: none;
        }

        .hero-content { position: relative; z-index: 1; text-align: center; max-width: 900px; padding: 0 20px; }
        
        .clip-text { overflow: hidden; display: block; }
        .clip-text span { display: block; transform: translateY(100%); }
        
        h1 { font-size: clamp(3rem, 6vw, 6rem); font-weight: 900; line-height: 1; letter-spacing: -2px; margin-bottom: 20px; }
        p.subtitle { font-size: 1.2rem; color: #888; max-width: 600px; margin: 0 auto 40px; opacity: 0; }
        
        .btn-glow {
            position: relative; display: inline-block; padding: 20px 40px; background: transparent; color: var(--text);
            font-weight: 700; letter-spacing: 2px; text-decoration: none; border: 1px solid rgba(255,255,255,0.2);
            border-radius: 50px; overflow: hidden; transition: 0.4s; opacity: 0;
        }
        .btn-glow:hover { border-color: var(--accent-glow); box-shadow: 0 0 30px rgba(44,230,131,0.2); background: rgba(44,230,131,0.05); }
        
        /* Contenedor del Quiz */
        .quiz-section { min-height: 100vh; padding: 100px 20px; display: flex; justify-content: center; align-items: center; }
        .quiz-wrapper { width: 100%; max-width: 1000px; height: 70vh; background: #0a0a0a; border-radius: 20px; border: 1px solid #1a1a1a; overflow: hidden; opacity: 0; transform: translateY(50px); }
    </style>
</head>
<body>
    <header class="header"><div class="logo">FILOKER</div></header>

    <section class="hero">
        <div class="glow-sphere"></div>
        <div class="hero-content">
            <h1 class="clip-text"><span class="gsap-rev">Sinergia Clínica.</span></h1>
            <h1 class="clip-text"><span class="gsap-rev" style="color: var(--accent-glow);">Resultados Reales.</span></h1>
            <p class="subtitle gsap-fade">El protocolo dermatológico avanzado para detener la caída y estimular el crecimiento folicular desde la primera semana.</p>
            <a href="#quiz" class="btn-glow gsap-fade">INICIAR DIAGNÓSTICO</a>
        </div>
    </section>

    <section id="quiz" class="quiz-section">
        <div class="quiz-wrapper gsap-quiz">
            <div data-tf-live="TU_ID_AQUI" style="width:100%; height:100%;"></div>
            <script src="//embed.typeform.com/next/embed.js"></script>
        </div>
    </section>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script>
        gsap.registerPlugin(ScrollTrigger);

        // Animación de entrada del Hero
        const tl = gsap.timeline();
        tl.to(".gsap-rev", { y: "0%", duration: 1, stagger: 0.2, ease: "power4.out", delay: 0.2 })
          .to(".gsap-fade", { opacity: 1, y: 0, duration: 1, stagger: 0.1, ease: "power2.out" }, "-=0.5");

        // Animación del Quiz al hacer Scroll
        gsap.to(".gsap-quiz", {
            scrollTrigger: { trigger: ".quiz-section", start: "top 70%" },
            opacity: 1, y: 0, duration: 1.2, ease: "expo.out"
        });

        // Efecto parallax sutil en la luz
        gsap.to(".glow-sphere", {
            scrollTrigger: { trigger: ".hero", start: "top top", end: "bottom top", scrub: true },
            y: 200, scale: 1.2
        });
    </script>
</body>
</html>
